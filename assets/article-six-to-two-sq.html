<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Cabinet Grotesk", "Helvetica Neue", sans-serif;
    background: #0f0e0d;
    color: #e8e4dc;
    padding: 44px 36px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-weight: 800;
    font-size: 84px;
    line-height: 0.9;
    letter-spacing: -0.045em;
    text-align: center;
  }
  .fan {
    position: relative;
    width: 100%;
    height: 300px;
    margin-top: 28px;
  }
  .card {
    position: absolute;
    background: #f5f4f0;
    color: #1a1917;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 16px 32px rgba(0,0,0,0.35);
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .small {
    width: 132px;
    height: 248px;
    font-size: 24px;
    line-height: 1.05;
    padding: 12px;
  }
  .c1 { left: 36px;  top: 36px; transform: rotate(-7deg); z-index: 1; }
  .c2 { left: 176px; top: 18px; transform: rotate(-4deg); z-index: 2; }
  .c3 { left: 316px; top: 6px;  transform: rotate(-1deg); z-index: 6; outline: 3px solid #c8b89a; color: #7a5c38; }
  .c4 { left: 456px; top: 8px;  transform: rotate(2deg);  z-index: 4; }
  .c5 { left: 596px; top: 20px; transform: rotate(5deg);  z-index: 3; }
  .c6 { left: 736px; top: 38px; transform: rotate(8deg);  z-index: 2; }
  .pair {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 28px;
  }
  .big {
    position: relative;
    width: 230px;
    height: 400px;
    font-size: 40px;
    border-radius: 28px;
  }
  .big:first-child { transform: rotate(-3deg); }
  .big:last-child { transform: rotate(3deg); }
</style>
</head>
<body>
  <h1>6 steps → 2</h1>
  <div class="fan" aria-hidden="true">
    <article class="card small c1">Intro</article>
    <article class="card small c2">Education</article>
    <article class="card small c3">They left</article>
    <article class="card small c4">Scan</article>
    <article class="card small c5">Threats</article>
    <article class="card small c6">Done</article>
  </div>
  <div class="pair">
    <article class="card big">Scan</article>
    <article class="card big">Remove</article>
  </div>
</body>
</html>
